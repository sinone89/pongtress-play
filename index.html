<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PONGTRESS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/game.css?v=085">
</head>
<body>
  <div id="app">
    <!-- 타이틀(풀스크린 키아트 + 터치하여 시작) -->
    <section id="title" class="screen">
      <img id="title-art" src="assets/char/behemoth_cg.png" alt="" onerror="this.style.display='none'">
      <div class="title-top">
        <h1 class="logo">PONGTRESS</h1>
        <p class="tagline">튕겨서 충전하는 로그라이크 핀볼</p>
      </div>
      <div class="title-btm">
        <button id="btn-start" class="btn primary">터치하여 시작</button>
        <p class="version">prototype 0.2 · 전투 코어</p>
      </div>
    </section>

    <!-- 로비 -->
    <section id="lobby" class="screen" hidden>
      <header id="lobby-top">
        <span class="cur">🪙<b id="cur-gold">0</b></span>
        <span class="cur">🔩<b id="cur-mats">0</b></span>
        <span class="cur">💎<b id="cur-gems">0</b></span>
        <span class="cur">📜<b id="cur-docs">0</b></span>
        <button class="mute-btn lobby-mute"><span class="mute-icon">🔊</span></button>
      </header>
      <main id="lobby-main">
        <div id="tab-home" class="lobby-panel">
          <canvas id="idle-canvas"></canvas>
          <span class="home-scene-tag">⚔ 자동 전투 중…</span>
          <div id="idle-reward" class="idle-card"></div>
        </div>
        <div id="tab-sortie" class="lobby-panel" hidden>
          <h2>🚀 출격</h2>
          <div class="sns-h">스테이지 선택</div>
          <div id="stage-select"></div>
          <p id="stage-info" class="muted"></p>
          <div class="sns-h">편성 부대 <span class="sns-sub">편성 탭에서 변경</span></div>
          <div id="sortie-party"></div>
          <p id="sortie-warn" class="muted" hidden></p>
          <button id="btn-sortie" class="btn primary home-cta-btn">출격</button>
        </div>
        <div id="tab-formation" class="lobby-panel" hidden>
          <h2>⚔️ 편성</h2>
          <div class="sns-h">부대 배치 <span class="sns-sub">3레인 · 탭하여 해제</span></div>
          <div id="lane-slots"></div>
          <div class="sns-h">보유 캐릭터 <span class="sns-sub" id="owned-count"></span></div>
          <div id="owned-list"></div>
        </div>
        <div id="tab-shop" class="lobby-panel" hidden>
          <h2>🛒 상점 · 가챠</h2>
          <div id="gacha-box"></div>
          <div class="sns-h">📜 문서 교환소</div>
          <div id="doc-shop"></div>
        </div>
        <div id="tab-mission" class="lobby-panel" hidden>
          <h2>📋 미션</h2>
          <div id="mission-list"></div>
        </div>
      </main>
      <nav id="lobby-nav">
        <button class="tabbtn active" data-tab="home"><span class="tb-ic">🏠</span>홈</button>
        <button class="tabbtn" data-tab="sortie"><span class="tb-ic">🚀</span>출격</button>
        <button class="tabbtn" data-tab="formation"><span class="tb-ic">👥</span>편성</button>
        <button class="tabbtn" data-tab="shop"><span class="tb-ic">🛒</span>상점</button>
        <button class="tabbtn" data-tab="mission"><span class="tb-ic">📋</span>미션</button>
      </nav>
    </section>

    <!-- 캐릭터 상세 -->
    <div id="char-modal" class="modal" hidden><div class="modal-box" id="char-modal-box"></div></div>
    <!-- 가챠 결과 -->
    <div id="gacha-modal" class="modal" hidden><div class="modal-box" id="gacha-modal-box"></div></div>
    <!-- 치트(디버그): 좌하단 build 탭 -->
    <div id="cheat-modal" class="modal" hidden><div class="modal-box" id="cheat-box"></div></div>

    <!-- 전투 오버레이 -->
    <section id="combat" class="screen" hidden>
      <header id="combat-top">
        <span id="c-name" class="c-name">전투 1</span>
        <span id="c-phase" class="c-phase">장전</span>
        <span id="c-level" class="c-level">Lv.1</span>
        <div id="exp-bar"><div id="exp-fill"></div></div>
      </header>
      <div id="stage-wrap"><canvas id="stage"></canvas></div>
      <footer id="combat-dock">
        <div id="skill-row"></div>
        <div id="control-row">
          <span id="aim-hint" class="aim-hint">핀볼판을 드래그해 조준 · 떼면 발사</span>
          <button class="ctl mute-btn"><span class="mute-icon">🔊</span></button>
          <button id="btn-auto" class="ctl">자동 OFF</button>
        </div>
      </footer>
    </section>

    <!-- 레벨업 보상 -->
    <div id="reward" class="modal" hidden>
      <div class="modal-box">
        <h2 id="reward-title">레벨 업!</h2>
        <p class="muted" id="reward-sub">보상 하나를 고르세요</p>
        <div id="reward-choices"></div>
      </div>
    </div>

    <!-- 결과 -->
    <div id="result" class="modal" hidden>
      <div class="modal-box">
        <h2 id="result-title">승리</h2>
        <p id="result-body" class="muted"></p>
        <button id="btn-result" class="btn primary">로비로</button>
      </div>
    </div>

    <p id="boot-error" hidden></p>
  </div>
  <div id="build-tag"></div>

  <script src="js/audio.js?v=085"></script>
  <script src="js/content.js?v=085"></script>
  <script src="js/meta.js?v=085"></script>
  <script src="js/game.js?v=085"></script>
</body>
</html>

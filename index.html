<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PONGTRESS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/game.css?v=157">
  <link rel="stylesheet" href="css/skin.css?v=157">
  <link rel="preload" as="image" href="assets/logo.webp" type="image/webp">
</head>
<body>
  <script>
    /* 오래된 브라우저 안내(build 156): 화면 크기를 전부 cqw(컨테이너 단위)로 잡아서 지원하지 않는 브라우저(Chrome 105↓·Safari 16↓·삼성 인터넷 20↓·구형 인앱 웹뷰)에서는 레이아웃이 크게 깨진다 — 조용히 깨지는 대신 알려 준다 */
    (function () {
      var msgs = [];
      try { if (!(window.CSS && CSS.supports && CSS.supports('width', '1cqw'))) msgs.push('이 브라우저는 화면을 제대로 보여 주지 못해요. 최신 Chrome(105↑) 또는 Safari(16↑)에서 열어 주세요.'); } catch (e) {}
      try { localStorage.setItem('__pt', '1'); localStorage.removeItem('__pt'); } catch (e) { msgs.push('이 브라우저는 저장 공간을 쓸 수 없어요(시크릿 모드·저장 차단 등). 진행 상황이 저장되지 않아요.'); }   // 저장이 막히면 로그인해도 새로고침 때마다 로그인 화면으로 돌아온다
      if (!msgs.length) return;
      document.addEventListener('DOMContentLoaded', function () {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;padding:14px 16px;background:#3a1020;color:#ffd0dc;font:700 14px/1.5 system-ui,sans-serif;text-align:center;border-bottom:2px solid #ff5d7a';
        d.textContent = msgs.join(' ');
        document.body.appendChild(d);
      });
    })();
  </script>
  <div id="app">
    <!-- 로그인 게이트(로컬 다중 프로필: 아이디/비번) -->
    <div id="login">
      <h1 class="lg-logo logo-wrap"><span class="logo-tx">PONGTRESS</span><img class="logo-im" alt="PONGTRESS" src="assets/logo.webp" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></h1>
      <p class="lg-tag">튕겨서 장전하는 로그라이크 핀볼</p>
      <div class="lg-box">
        <input id="lg-id" placeholder="아이디" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16">
        <input id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password" maxlength="24">
        <div class="lg-msg" id="lg-msg"></div>
        <button class="lg-btn" id="lg-login">로그인 / 시작</button>
      </div>
      <p class="lg-note">처음 쓰는 아이디는 자동으로 새 계정이 만들어져요 · 이 기기에만 저장</p>
    </div>

    <!-- 타이틀(풀스크린 키아트 + 터치하여 시작) -->
    <section id="title" class="screen">
      <img id="title-art" src="assets/bg/bg_title.webp" alt="" onerror="this.style.display='none'">
      <div id="title-hero" aria-hidden="true"></div>   <!-- 중앙 연출: 편성 캐릭터 CG가 서 있고 몇 초마다 바뀜(game.js initTitleHero) -->
      <div class="title-top">
        <h1 class="logo logo-wrap"><span class="logo-tx">PONGTRESS</span><img class="logo-im" alt="PONGTRESS" src="assets/logo.webp" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></h1>
        <p class="tagline">튕겨서 장전하는 로그라이크 핀볼</p>
      </div>
      <div class="title-btm">
        <button id="btn-start" class="btn primary">터치하여 시작</button>
      </div>
    </section>

    <!-- 로비 -->
    <section id="lobby" class="screen" hidden>
      <header id="lobby-top">
        <span class="cur" data-cur="gold" role="button" aria-label="크레딧 설명"><span class="uic"><span class="uic-fb">🪙</span><img class="uic-im" alt="" src="assets/ui/cur_gold.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span><b id="cur-gold">0</b></span>
        <span class="cur" data-cur="mats" role="button" aria-label="재료 설명"><span class="uic"><span class="uic-fb">🔩</span><img class="uic-im" alt="" src="assets/ui/cur_mats.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span><b id="cur-mats">0</b></span>
        <span class="cur" data-cur="gems" role="button" aria-label="보석 설명"><span class="uic"><span class="uic-fb">💎</span><img class="uic-im" alt="" src="assets/ui/cur_gems.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span><b id="cur-gems">0</b></span>
        <span class="cur" data-cur="docs" role="button" aria-label="문서 설명"><span class="uic"><span class="uic-fb">📄</span><img class="uic-im" alt="" src="assets/ui/cur_docs.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span><b id="cur-docs">0</b></span>
        <button class="mute-btn lobby-mute"><span class="mute-icon">🔊</span></button>
        <button class="help-btn lobby-help" data-help="open" aria-label="도움말"><span class="uic"><span class="uic-fb">❔</span><img class="uic-im" alt="" src="assets/ui/ic_info.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></button>
        <button class="acct-btn" id="acct-btn"></button>
      </header>
      <main id="lobby-main">
        <div id="tab-home" class="lobby-panel">
          <canvas id="idle-canvas"></canvas>
          <button id="codex-btn" class="home-fab" data-codex="open" aria-label="도감"><span class="uic"><span class="uic-fb">📖</span><img class="uic-im" alt="" src="assets/ui/ic_codex.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span><span class="hf-tx">도감</span><i class="hf-dot"></i></button>
          <div id="idle-reward" class="idle-card"></div>
        </div>
        <div id="tab-sortie" class="lobby-panel" hidden>
          <div id="mode-select"></div>
          <div class="sns-h" id="stage-head">스테이지 선택</div>
          <div id="stage-select"></div>
          <div id="stage-info"></div>
          <div class="sns-h">편성 부대</div>
          <div id="sortie-party"></div>
          <p id="sortie-warn" class="muted" hidden></p>
          <div class="cta-bar"><button id="btn-sortie" class="btn primary home-cta-btn">출격</button></div>
        </div>
        <div id="tab-formation" class="lobby-panel" hidden>
          <div class="sns-h">부대 배치</div>
          <div id="lane-slots"></div>
          <div class="sns-h">보유 동료 <span class="sns-sub" id="owned-count"></span></div>
          <div id="owned-list"></div>
        </div>
        <div id="tab-shop" class="lobby-panel" hidden>
          <div id="shop-body"></div>
        </div>
        <div id="tab-mission" class="lobby-panel" hidden>
          <div id="mission-list"></div>
        </div>
      </main>
      <nav id="lobby-nav">
        <button class="tabbtn active" data-tab="home"><span class="tb-ic"><span class="uic"><span class="uic-fb">🏠</span><img class="uic-im" alt="" src="assets/ui/nav_home.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></span>홈</button>
        <button class="tabbtn" data-tab="sortie"><span class="tb-ic"><span class="uic"><span class="uic-fb">🚀</span><img class="uic-im" alt="" src="assets/ui/nav_sortie.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></span>출격</button>
        <button class="tabbtn" data-tab="formation"><span class="tb-ic"><span class="uic"><span class="uic-fb">👥</span><img class="uic-im" alt="" src="assets/ui/nav_formation.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></span>편성</button>
        <button class="tabbtn" data-tab="shop"><span class="tb-ic"><span class="uic"><span class="uic-fb">🛒</span><img class="uic-im" alt="" src="assets/ui/nav_shop.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></span>상점</button>
        <button class="tabbtn" data-tab="mission"><span class="tb-ic"><span class="uic"><span class="uic-fb">📋</span><img class="uic-im" alt="" src="assets/ui/nav_mission.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></span>미션</button>
      </nav>
    </section>

    <!-- 캐릭터 상세 -->
    <div id="char-modal" class="modal" hidden>
      <button class="cd-nav cd-prev" data-cnav="-1">‹</button>
      <div class="modal-box" id="char-modal-box"></div>
      <button class="cd-nav cd-next" data-cnav="1">›</button>
    </div>
    <!-- 가챠 결과 -->
    <div id="gacha-modal" class="modal" hidden><div class="modal-box" id="gacha-modal-box"></div></div>
    <!-- 치트(디버그): 좌하단 build 탭 -->
    <div id="cheat-modal" class="modal" hidden><div class="modal-box" id="cheat-box"></div></div>

    <!-- 전투 오버레이 -->
    <section id="combat" class="screen" hidden>
      <header id="combat-top">
        <button id="btn-exit" class="exit-btn" data-exit="1" aria-label="로비로 나가기">‹</button>
        <span id="c-name" class="c-name">전투 1</span>
        <span id="c-phase" class="c-phase">장전</span>
        <span id="c-level" class="c-level">Lv.1</span>
        <button id="speed-btn" class="speed-btn" aria-label="배속">×1</button>
        <button class="mute-btn combat-mute"><span class="mute-icon">🔊</span></button>
        <button class="help-btn combat-help" data-help="open" aria-label="도움말"><span class="uic"><span class="uic-fb">❔</span><img class="uic-im" alt="" src="assets/ui/ic_info.png" onload="this.parentNode.classList.add('ok')" onerror="this.remove()"></span></button>
        <div id="exp-bar"><div id="exp-fill"></div></div>
        <div id="relic-bar"></div>
        <div id="enemy-bar"></div>
      </header>
      <div id="battle-main">
        <div id="stage-wrap">
          <canvas id="stage"></canvas>
          <aside id="battle-side">
            <div class="side-toggles">
              <button id="auto-skill-btn" class="side-tgl"><b>스킬</b>자동 OFF</button>
              <button id="btn-auto" class="side-tgl"><b>전투</b>자동 OFF</button>
            </div>
            <div id="skill-col"></div>
          </aside>
        </div>
      </div>
      <!-- 분기 맵(A안) — 전투 화면 위 전체 오버레이 -->
      <div id="map" hidden>
        <div id="map-head"></div>
        <div id="map-relics"></div>
        <div id="map-body"></div>
      </div>
    </section>

    <!-- 런 모달(상점·정비·모듈 정보) · 나가기 확인 · 토스트 -->
    <div id="run-modal" class="modal" hidden><div class="modal-box" id="run-modal-box"></div></div>
    <div id="exit-modal" class="modal" hidden><div class="modal-box" id="exit-box"></div></div>
    <div id="toast" class="toast"></div>

    <!-- 레벨업 보상 -->
    <div id="reward" class="modal" hidden>
      <div class="modal-box">
        <h2 id="reward-title">레벨업!</h2>
        <p class="muted" id="reward-sub"></p>
        <div id="reward-choices"></div>
      </div>
    </div>

    <!-- 결과 -->
    <div id="result" class="modal" hidden>
      <div class="modal-box result-box" id="result-box">
        <h2 id="result-title">승리</h2>
        <p id="result-body" class="rs-sub"></p>
        <div id="result-stats" class="rs-stats"></div>
        <div id="result-earn" class="rs-earn"></div>
        <div id="result-notes" class="rs-notes"></div>
        <div id="result-next" class="rs-next"></div>
        <button id="btn-result" class="btn primary">로비로</button>
      </div>
    </div>

    <p id="boot-error" hidden></p>
  </div>
  <div id="build-tag"></div>

  <script src="js/audio.js?v=157"></script>
  <script src="js/spritemeta.js?v=157"></script>
  <script src="js/artmeta.js?v=157"></script>
  <script src="js/content.js?v=157"></script>
  <script src="js/meta.js?v=157"></script>
  <script src="js/game.js?v=157"></script>
  <script src="js/tutorial.js?v=157"></script>
  <script src="js/help.js?v=157"></script>
  <script src="js/codex.js?v=157"></script>
</body>
</html>
